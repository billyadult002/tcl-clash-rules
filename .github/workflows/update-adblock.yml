name: update-adblock

on:
  schedule:
    # daily 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate adblock.yaml from upstream
        run: python3 scripts/gen_adblock.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adblock.yaml
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "auto: update adblock list $(date -u +%F)"
            git push
          fi
